<!doctype html>
<html lang="en">
<head>

   <title>Joseph Photos</title>
   <link rel="stylesheet" href="../../pbase/pbase-gallery.css?v=7">

<body>
   <h1>Joseph</h1>
   <nav>(<a href="intro.html">back</a>)</nav>
   <main class="gallery">
      <figure class="gallery-item">

      <figure class="gallery-item">

      <figure class="gallery-item">
         <img src="and-friends.jpg" width="448" height="459" alt="Joseph with Andy and Wes" loading="lazy">
         <figcaption>Joseph's 9th Birthday, Wes and Andy</figcaption>
      </figure>
      <figure class="gallery-item">
         <img src="08-11-97.png" width="588" height="872" alt="Joseph" loading="lazy">
         <figcaption></figcaption>
      </figure>
      <figure class="gallery-item">
         <img src="and-jim-gorge.png" width="891" height="598" alt="Joseph and Jim" loading="lazy">

      </figure>

      </figure>

      </figure>
      <figure class="gallery-item">
         <img src="fishing.png" width="592" height="875" alt="Joseph fishing" loading="lazy">
         <figcaption></figcaption>
      </figure>
      <figure class="gallery-item">
         <img src="on-bike.png" width="628" height="592" alt="Joseph on a bike" loading="lazy">
         <figcaption></figcaption>
      </figure>
   </main>

   <div class="lightbox-overlay" id="lightbox">
      <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
      <button class="lightbox-prev" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="lightbox-next" type="button" aria-label="Next photo">&#10095;</button>
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-caption" id="lightbox-caption"></div>
   </div>

</html>
