<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="David's photos">

	<link rel="canonical" href="https://jljcd.com/our-boys/david-photos" />

	<title>David Photos</title>

	<style>
		body {
			margin: 0;
			background-color: #fff;
			color: #000;
			font-family: Georgia, "Times New Roman", Times, serif;
		}

		.pageblock {
			margin-left: 30px;
			margin-top: 35px;
			max-width: 900px;
			padding-right: 20px;
			padding-bottom: 35px;
		}

		@media (max-width: 600px) {
			.pageblock {
				margin-left: 10px;
				margin-top: 20px;
				padding-right: 20px;
				padding-bottom: 20px;
			}
		}

		h1 {
			font-family: "Times New Roman", Times, serif;
			font-size: 2rem;
			margin: 0 0 1rem;
		}

		.gallery {
			display: grid;
			grid-template-columns: repeat(2, 1fr);
			gap: 1.5rem;
		}

		@media (max-width: 600px) {
			.gallery {
				grid-template-columns: 1fr;
			}
		}

		figure {
			margin: 0;
			text-align: center;
		}

		img {
			max-width: 100%;
			height: auto;
			display: block;
			margin: 0 auto 0.5rem;
		}

		figcaption {
			font-size: 1.1rem;
		}

		a {
			color: maroon;
			text-decoration: underline;
		}

		a:hover {
			color: white;
			text-decoration: none;
			background: maroon;
		}
	</style>
</head>

<body>

	<div class="pageblock">
		<h1>David Photos</h1>
		<p>(<a href="david.html">back</a>)</p>

		<div class="gallery">
			<figure>
				<img src="david.jpg" alt="David getting a little stretch">
				<figcaption>Getting a little stretch</figcaption>
			</figure>

			<figure>
				<img src="david-boat.jpg" alt="David boating">
				<figcaption>Boating</figcaption>
			</figure>

			<figure>
				<img src="david-and-dad-75.jpg" alt="David and Dad">
				<figcaption>What's that?</figcaption>
			</figure>

			<figure>
				<img src="david-sitting-75.jpg" alt="David taking a break">
				<figcaption>A break?</figcaption>
			</figure>

			<figure>
				<img src="david-horse-75.jpg" alt="David with a horse">
				<figcaption>Horse</figcaption>
			</figure>

			<figure>
				<img src="david-ball-75.jpg" alt="David with a ball">
				<figcaption>Ball</figcaption>
			</figure>
		</div>
	</div>

</body>

</html>
