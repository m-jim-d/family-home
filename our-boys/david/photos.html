<!doctype html>
<html lang="en">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="description" content="David's photos">
   <link rel="canonical" href="https://jljcd.com/our-boys/david/photos" />
   <title>David Photos</title>
   <link rel="stylesheet" href="../../pbase/pbase-gallery.css?v=7">
   <script src="../../pbase/pbase-gallery.js?v=7" defer></script>
</head>
<body>
   <h1>David</h1>
   <nav>(<a href="intro.html">back</a>)</nav>
   <main class="gallery">
      <figure class="gallery-item">
         <img src="closeup.jpg" width="468" height="496" alt="David" loading="lazy">
         <figcaption></figcaption>
      </figure>
      <figure class="gallery-item">
         <img src="david.jpg" width="341" height="736" alt="David getting a little stretch" loading="lazy">
         <figcaption>Getting a little stretch.</figcaption>
      </figure>
      <figure class="gallery-item">
         <img src="boat.jpg" width="269" height="497" alt="David boating" loading="lazy">
         <figcaption>Boating</figcaption>
      </figure>
      <figure class="gallery-item">
         <img src="and-dad-75.jpg" width="296" height="452" alt="David and Dad" loading="lazy">
         <figcaption>What's that?</figcaption>
      </figure>
      <figure class="gallery-item">
         <img src="sitting-75.jpg" width="229" height="449" alt="David taking a break" loading="lazy">
         <figcaption></figcaption>
      </figure>
      <figure class="gallery-item">
         <img src="horse-75.jpg" width="271" height="449" alt="David with a horse" loading="lazy">
         <figcaption></figcaption>
      </figure>
      <figure class="gallery-item">
         <img src="ball-75.jpg" width="272" height="450" alt="David with a ball" loading="lazy">
         <figcaption></figcaption>
      </figure>
   </main>

   <div class="lightbox-overlay" id="lightbox">
      <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
      <button class="lightbox-prev" type="button" aria-label="Previous photo">&#10094;</button>
      <button class="lightbox-next" type="button" aria-label="Next photo">&#10095;</button>
      <img id="lightbox-img" src="" alt="">
      <div class="lightbox-caption" id="lightbox-caption"></div>
   </div>
</body>
</html>
