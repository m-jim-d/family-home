   <h1>Windsurfing on Waconia</h1>
   <p class="subtitle">
      Windsurfing is a mix of fun and work.
      This series shows multiple windsurfers on the lake (on plane), and in the forground, one rigging a sail.
      My <a href="https://waconia.triquence.org/waconia" target="_blank" rel="noopener">weather site</a> is named after this lake.
      See <a href="https://waconia.triquence.org/weather?station=XL063&days=24h" target="_blank" rel="noopener">current conditions</a>.
   </p>
