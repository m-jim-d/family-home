<!doctype html>
<html lang="en">

<head>
  <link rel="canonical" href="https://jljcd.com/fractals/fractals" />
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Mandelbrot and Julia fractals">

	<title>Fractals</title>

	<link rel="stylesheet" href="../pbase/pbase-gallery.css">
	<script src="../pbase/pbase-gallery.js" defer></script>
</head>

<body>
	<h1>Fractals</h1>
	<p class="subtitle">These are Mandelbrot fractals. Blue Roses and Black Eyes are the Julia variations.</p>
	<nav>(<a href="../oldies.html">back</a>)</nav>

	<main class="gallery">
		<figure class="gallery-item" data-rotate="0">
			<img src="horse.jpg" alt="Horse" loading="lazy">
			<figcaption>Horse</figcaption>
		</figure>

		<figure class="gallery-item" data-rotate="0">
			<img src="stop-1-on-the-ride.jpg" alt="Stop on the way" loading="lazy">
			<figcaption>Stop on the way</figcaption>
		</figure>

		<figure class="gallery-item" data-rotate="0">
			<img src="black-eyes.jpg" alt="Black Eyes" loading="lazy">
			<figcaption>Black Eyes</figcaption>
		</figure>

		<figure class="gallery-item" data-rotate="0">
			<img src="blue-roses.jpg" alt="Blue Roses" loading="lazy">
			<figcaption>Blue Roses</figcaption>
		</figure>

		<figure class="gallery-item" data-rotate="0">
			<img src="pink-lemonade.jpg" alt="Pink Lemonade" loading="lazy">
			<figcaption>Pink Lemonade</figcaption>
		</figure>
	</main>

	<div class="lightbox-overlay" id="lightbox">
		<button class="lightbox-close" type="button" aria-label="Close">&times;</button>
		<button class="lightbox-prev" type="button" aria-label="Previous photo">&#10094;</button>
		<button class="lightbox-next" type="button" aria-label="Next photo">&#10095;</button>
		<img id="lightbox-img" src="" alt="">
		<div class="lightbox-caption" id="lightbox-caption"></div>
	</div>
</body>

</html>
